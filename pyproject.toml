[project]
name = "macro-data-observatory"
version = "0.1.0"
description = "Data engineering platform for macroeconomic datasets (World Bank, IMF, FRED)"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Macro Evidence" }
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"